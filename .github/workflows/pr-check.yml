name: PR Validation & Quality Gate

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-backend:
    name: Validate Backend (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: recruitment_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Verify Python Code & Syntax
        run: |
          python -m compileall backend/app backend/main.py backend/reset_database.py

      - name: Run Backend Tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/recruitment_test
        run: |
          cd backend
          python -m pytest tests -q

  test-frontend:
    name: Validate Frontend (Vite & React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build React App (Check for build errors)
        run: |
          cd frontend
          npm run build
